{{- range $serviceName, $serviceData := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "cinemaabyss.labels" $ | nindent 4 }}
spec:
  type: {{ $serviceData.service.type }}
  selector:
    {{- toYaml $serviceData.labelsPods | nindent 4 }}
  ports:
    - port: {{ $serviceData.service.port }}
      targetPort: {{ $serviceData.service.targetPort }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}-deployment
  namespace: {{ $.Values.global.namespace }}
  labels:
      {{- include "cinemaabyss.labels" $ | nindent 6 }}
spec:
  replicas: {{ $serviceData.replicas }}
  selector:
    matchLabels:
      {{- toYaml $serviceData.labelsPods | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- toYaml $serviceData.labelsPods | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      restartPolicy: Always
      containers:
        - name: cinemaabyss-{{ $serviceName }}
          image: {{ $serviceData.image.repository }}:{{ $serviceData.image.tag }}
          imagePullPolicy: {{ $serviceData.image.pullPolicy }}
          ports:
            - containerPort: {{ $serviceData.service.targetPort }}
          {{- if $serviceData.envFrom }}
          envFrom:
            {{- toYaml $serviceData.envFrom | nindent 12 }}
          {{- end }}
          env:
            {{- toYaml $serviceData.env | nindent 12 }}
          resources:
            {{- toYaml $serviceData.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml $serviceData.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $serviceData.livenessProbe | nindent 12 }}

{{- end }}

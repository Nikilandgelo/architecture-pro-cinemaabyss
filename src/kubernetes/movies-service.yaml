apiVersion: v1
kind: Service
metadata:
  name: movies-service
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: movies-service-pod
  ports:
    - port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-service-deployment
  namespace: cinemaabyss
  labels:
    app: movies-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movies-service-pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: movies-service-pod
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      restartPolicy: Always
      containers:
      - name: cinemaabyss-movies-service
        image: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/movies-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_CONNECTION_STRING
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
        envFrom:
        - secretRef:
            name: postgres-secrets
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /api/movies/health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/movies/health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20

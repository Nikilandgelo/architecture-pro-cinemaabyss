apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: cinemaabyss
data:
  KAFKA_NODE_ID: "1"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_PROCESS_ROLES: "broker,controller"

  KAFKA_CONTROLLER_LISTENER_NAMES: "KRAFT"
  KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: "localhost:10092"
  KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,KRAFT://0.0.0.0:10092"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,KRAFT:PLAINTEXT"
  KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9093"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:10092"

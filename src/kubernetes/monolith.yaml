apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: monolith-pod
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-deployment
  namespace: cinemaabyss
  labels:
    app: monolith-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolith-pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: monolith-pod
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      restartPolicy: Always
      containers:
      - name: cinemaabyss-monolith
        image: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/monolith:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DB_CONNECTION_STRING
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
        envFrom:
        - secretRef:
            name: postgres-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /api/users
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/users
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

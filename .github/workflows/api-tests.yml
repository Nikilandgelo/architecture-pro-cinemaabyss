name: API Tests

on:
  push:
    branches:
      - 'main'
      - 'cinema'
    paths:
      - 'src/**'
      - '.github/workflows/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  DB_PORT: ${{ secrets.DB_PORT }}

  KAFKA_PORT: "9093"
  KAFKA_LISTENER_NAME: ${{ secrets.KAFKA_LISTENER_NAME }}
  KAFKA_NODE_ID: ${{ secrets.KAFKA_NODE_ID }}
  KAFKA_UI_PORT: "11080"

  MONOLITH_PORT: "8080"
  MOVIES_PORT: "8081"
  EVENTS_PORT: "8082"
  PROXY_PORT: "8000"

jobs:
  run-api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose --version

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 120

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Run API tests
        working-directory: tests/postman
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 15

          docker build -t cinemaabyss-api-tests .
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests

      - name: Stop services
        if: always()
        run: docker compose down

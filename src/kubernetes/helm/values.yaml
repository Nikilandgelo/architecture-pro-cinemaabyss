global:
  namespace: cinemaabyss-helm
  domain: cinemaabyss.example.com

imagePullSecrets:
  # REPLACE BEFORE PUSHING
  dockerconfigjson: <placeholder_after_completion_because_i_dont_want_leaked_token>

# Opaque secrets for overriding after from another values_file or via --set flag
secrets:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""

# Database configuration
database:
  enabled: true
  port: 6432
  image:
    repository: postgres
    tag: 18-alpine
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce

# Kafka configuration
kafka:
  enabled: true
  internalPort: 9092
  externalPort: 9094
  image:
    repository: apache/kafka
    tag: 4.3.1
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  persistence:
    size: 5Gi
    accessMode: ReadWriteOnce

services:
  # Monolith configuration
  monolith:
    enabled: true
    labelsPods:
      app: monolith-pod
    env:
      - name: PORT
        value: "8080"
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_DB
      - name: DB_CONNECTION_STRING
        value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:6432/$(POSTGRES_DB)?sslmode=disable"
    replicas: 1
    image:
      repository: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/monolith
      tag: latest
      pullPolicy: Always
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    service:
      port: 8080
      targetPort: 8080
      type: ClusterIP
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/users
        port: 8080
    livenessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/users
        port: 8080

  # Movies service configuration
  movies-service:
    enabled: true
    labelsPods:
      app: movies-service-pod
    env:
      - name: PORT
        value: "8081"
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: POSTGRES_DB
      - name: DB_CONNECTION_STRING
        value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:6432/$(POSTGRES_DB)?sslmode=disable"
    replicas: 1
    image:
      repository: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/movies-service
      tag: latest
      pullPolicy: Always
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    service:
      port: 8081
      targetPort: 8081
      type: ClusterIP
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/movies/health
        port: 8081
    livenessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/movies/health
        port: 8081

  # Events service configuration
  events-service:
    enabled: true
    labelsPods:
      app: events-service-pod
    env:
      - name: PORT
        value: "8082"
      - name: KAFKA_BROKERS
        value: "kafka:9092"
    replicas: 1
    image:
      repository: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/events-service
      tag: latest
      pullPolicy: Always
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    service:
      port: 8082
      targetPort: 8082
      type: ClusterIP
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/events/health
        port: 8082
    livenessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /api/events/health
        port: 8082

  # Proxy service configuration
  proxy-service:
    enabled: true
    labelsPods:
      app: proxy-service-pod
    env:
      - name: PORT
        value: "8000"
      - name: EVENTS_SERVICE_URL
        value: "http://events-service:8082"
    envFrom:
      - configMapRef:
          name: cinemaabyss-config
    replicas: 1
    image:
      repository: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/proxy-service
      tag: latest
      pullPolicy: Always
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    service:
      port: 8000
      targetPort: 8000
      type: ClusterIP
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000
    livenessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8000

# Ingress configuration
ingress:
  enabled: true
  hosts:
    - host: cinemaabyss.example.com
      http:
        paths:
        - path: /api/events
          pathType: Prefix
          backend:
            service:
              name: events-service
              port:
                number: 8082
        - path: /
          pathType: Prefix
          backend:
            service:
              name: proxy-service
              port:
                number: 8000

apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: proxy-service-pod
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service-deployment
  namespace: cinemaabyss
  labels:
    app: proxy-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service-pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-service-pod
    spec:
      imagePullSecrets:
        - name: dockerconfigjson
      restartPolicy: Always
      containers:
        - name: cinemaabyss-proxy-service
          image: ghcr.io/nikilandgelo/architecture-pro-cinemaabyss/proxy-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          env:
            - name: PORT
              value: "8000"
            - name: EVENTS_SERVICE_URL
              value: "http://events-service:8082"
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
